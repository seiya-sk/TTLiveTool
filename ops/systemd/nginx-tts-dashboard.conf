# レート制限ゾーン。
#   dash_static: Next.jsの静的アセット用(1ページで数十リクエスト飛ぶため緩め)
#   dash_app   : 認証が要求されるページ/API用
limit_req_zone $binary_remote_addr zone=dash_app:10m   rate=5r/s;
limit_req_zone $binary_remote_addr zone=dash_static:10m rate=30r/s;
limit_req_status 429;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # サーバのバージョン露出を止める
    server_tokens off;

    access_log /var/log/nginx/tts-dashboard.access.log;
    error_log  /var/log/nginx/tts-dashboard.error.log;

    # 画像・スクショなどのため
    client_max_body_size 16m;

    # 認証不要の静的アセット(proxy.ts の matcher が除外しているパス)
    location /_next/static/ {
        limit_req zone=dash_static burst=100 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # それ以外はすべて Basic認証の対象
    location / {
        limit_req zone=dash_app burst=30 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
    }
}
